name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for secrets
        run: pnpm run scan:secrets

      - name: Run tests
        run: pnpm test

      - name: Build Electron release
        run: pnpm run dist:win -- --publish never

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaGlance-win-release
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest.yml
          generate_release_notes: true
