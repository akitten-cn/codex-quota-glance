name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      CODEX_TASKBAR_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build portable release
        shell: powershell
        run: ./scripts/package-portable.ps1
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-taskbar-windows-x64
          path: |
            dist/codex-taskbar-*-windows-x64.exe
            dist/codex-taskbar-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/codex-taskbar-*-windows-x64.exe
          dist/codex-taskbar-*-windows-x64-portable.zip
          dist/SHA256SUMS.txt
          --generate-notes
          --verify-tag
