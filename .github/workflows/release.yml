name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      CODEX_TASKBAR_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build portable release
        shell: powershell
        run: ./scripts/package-portable.ps1
      - name: Build Windows installer
        shell: powershell
        run: ./scripts/package-installer.ps1 -SkipBuild
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-taskbar-windows-x64
          path: |
            dist/codex-taskbar-*-windows-x64.exe
            dist/codex-taskbar-*-windows-x64-setup.exe
            dist/codex-taskbar-*-windows-x64-setup.exe.sha256
            dist/codex-taskbar-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
  macos:
    uses: ./.github/workflows/macos-test.yml
  publish:
    needs: [windows-x64, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-taskbar-*
          merge-multiple: true
          path: release-assets
      - name: Publish combined Windows and macOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/codex-taskbar-*.exe \
            release-assets/codex-taskbar-*.exe.sha256 \
            release-assets/codex-taskbar-*.zip \
            release-assets/codex-taskbar-*.dmg \
            release-assets/SHA256SUMS*.txt \
            --notes-file docs/releases/0.2.3.md --verify-tag
