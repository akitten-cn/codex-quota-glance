name: macOS floating test build

on:
  workflow_call:
  push:
    branches: [feature/macos-floating]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Shared data and platform tests
        run: cargo test --workspace --locked
      - name: Popup placement regressions
        run: |
          swiftc apps/macos-host/WindowPlacement.swift scripts/macos-placement-tests.swift -o "$RUNNER_TEMP/placement-tests"
          "$RUNNER_TEMP/placement-tests"
      - name: Build app and test packages
        run: bash scripts/package-macos.sh
      - name: Update and host logging regressions
        run: |
          swiftc -swift-version 5 apps/macos-host/UpdateService.swift apps/macos-host/HostDiagnostics.swift scripts/macos-update-tests.swift -o "$RUNNER_TEMP/update-tests"
          "$RUNNER_TEMP/update-tests"
      - name: WKWebView and settings persistence smoke
        timeout-minutes: 3
        run: |
          export CODEX_TASKBAR_DATA_DIR="$RUNNER_TEMP/codex-taskbar-smoke"
          mkdir -p "$CODEX_TASKBAR_DATA_DIR"
          app="$(cat dist/macos-app-path.txt)"
          "$app/Contents/MacOS/CodexTaskbar" --smoke-test &
          host_pid=$!
          (sleep 16; screencapture -x "$CODEX_TASKBAR_DATA_DIR/smoke-desktop.png" || true) &
          (sleep 45; sample "$host_pid" 1 -file dist/smoke-stack.txt || true) &
          diagnostic_pid=$!
          wait "$host_pid"
          kill "$diagnostic_pid" 2>/dev/null || true
          test -f "$CODEX_TASKBAR_DATA_DIR/macos-smoke-results.json"
          test -n "$(find "$CODEX_TASKBAR_DATA_DIR/logs" -name 'codex-taskbar.jsonl*' -size +0c -print -quit)"
          cp "$CODEX_TASKBAR_DATA_DIR/macos-smoke-results.json" dist/
          cp "$CODEX_TASKBAR_DATA_DIR"/smoke-*.png dist/ 2>/dev/null || true
      - name: Upload packages and smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-taskbar-macos-${{ matrix.arch }}-test
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS-*.txt
            dist/*smoke*.json
            dist/smoke-*.png
            dist/smoke-stack.txt
          if-no-files-found: warn
