[workspace]
members = [
  "apps/codex-taskbar",
  "apps/codex-taskbar-settings",
  "crates/application",
  "crates/adapters-codex-app-server",
  "crates/adapters-codex-sqlite",
  "crates/diagnostics",
  "crates/domain",
  "crates/platform-windows",
  "crates/settings",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
codex-taskbar-application = { path = "crates/application" }
codex-taskbar-adapters-codex-app-server = { path = "crates/adapters-codex-app-server" }
codex-taskbar-adapters-codex-sqlite = { path = "crates/adapters-codex-sqlite" }
codex-taskbar-diagnostics = { path = "crates/diagnostics" }
codex-taskbar-domain = { path = "crates/domain" }
codex-taskbar-platform-windows = { path = "crates/platform-windows" }
codex-taskbar-settings = { path = "crates/settings" }
codex-taskbar-settings-ui = { path = "apps/codex-taskbar-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
webview2-com = "0.39.1"
slint = { version = "1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "1.13.1"
thiserror = "2"
time = { version = "0.3.45", features = ["parsing", "local-offset"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_Networking_WinHttp",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
